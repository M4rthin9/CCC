name: Audit visitor approval routing

on:
  push:
    branches: [audit/visitor-approvals-20261112]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed corrections to pending VIS reservations
        type: boolean
        default: false
      plan_hash:
        description: Exact planHash from the latest dry-run audit (required to apply)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check or reconcile production approval routing
        run: npx tsx scripts/audit-visitor-approvals.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          APPLY_VISITOR_RECHECK: ${{ inputs.apply || 'false' }}
          EXPECTED_PLAN_HASH: ${{ inputs.plan_hash }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-approval-audit
          path: approval-audit/report.json
          retention-days: 1
