name: Deploy Worker

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Select target environment
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "wrangler_env=--env development" >> "$GITHUB_OUTPUT"
            echo "d1_name=ccc-reservations-dev"   >> "$GITHUB_OUTPUT"
            echo "label=development"              >> "$GITHUB_OUTPUT"
            echo "Target: development (ccc-backend-dev / ccc-reservations-dev)"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "wrangler_env="                  >> "$GITHUB_OUTPUT"
            echo "d1_name=ccc-reservations"       >> "$GITHUB_OUTPUT"
            echo "label=production"               >> "$GITHUB_OUTPUT"
            echo "Target: production (ccc-backend / ccc-reservations)"
          else
            echo "::error::Refusing to deploy from ref '${{ github.ref_name }}' - only main (production) and dev (development) may deploy."
            exit 1
          fi

      - name: Check Cloudflare credentials
        id: creds
        env:
          API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "API_TOKEN set: NO"
            echo "::error::Missing secret CF_API_TOKEN. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "API_TOKEN set: YES"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "ACCOUNT_ID set: NO"
            echo "::error::Missing secret CF_ACCOUNT_ID (value 0e00d9b1beeaf05140dd3777e0d2de90)."
            exit 1
          fi
          echo "ACCOUNT_ID set: YES"

      - name: Deploy to Cloudflare Workers (${{ steps.target.outputs.label }})
        run: npx wrangler deploy ${{ steps.target.outputs.wrangler_env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations (${{ steps.target.outputs.d1_name }})
        run: npx wrangler d1 migrations apply ${{ steps.target.outputs.d1_name }} --remote ${{ steps.target.outputs.wrangler_env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
