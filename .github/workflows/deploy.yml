name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check Cloudflare credentials
        run: |
          echo "CF_ACCOUNT_ID present: $([ -n \"${{ secrets.CF_ACCOUNT_ID }}\" ] && echo YES || echo NO)"
          echo "CF_API_TOKEN present: $([ -n \"${{ secrets.CF_API_TOKEN }}\" ] && echo YES || echo NO)"
          echo "Using wrangler from local install:"
          ls node_modules/.bin/wrangler

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ccc-reservations --remote
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
