name = "ccc-backend"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0e00d9b1beeaf05140dd3777e0d2de90"

# ── Worker vars ────────────────────────────────────────────────────
[vars]
CACHE_VERSION = "v3"
PASSWORD_SALT = "cc-cafe-reservation-v1"
# Comma-separated list of frontend origins allowed to call the API.
# Use "*" during development. Example: https://ccc-backend.pongsinbas.workers.dev
ALLOWED_ORIGINS = "*"
# Comma-separated list of hostnames allowed to generate Turnstile tokens.
# IMPORTANT: these are the FRONTEND hosts that render the widget (siteverify
# returns the page hostname), NOT the backend worker hostname.
# Example: booking.example.com,www.example.com
TURNSTILE_ALLOWED_HOSTNAMES = "ccc-frontend.pages.dev,cafe.dpdns.org"

# ── Notifications (Web Push + LINE) ────────────────────────────────
# Feature switches (set to "true" to enable).
NOTIFY_PUSH_ENABLED = "false"
NOTIFY_LINE_ENABLED = "false"
# Fallback LINE monthly push-message cap (an admin-overridable setting wins).
LINE_MONTHLY_CAP = "200"

# ── D1 database ────────────────────────────────────────────────────
# Create with:  wrangler d1 create ccc-reservations
# then paste the returned database_id here and in the migration script note.
[[d1_databases]]
binding = "DB"
database_name = "ccc-reservations"
database_id = "c24082d0-67dd-4c21-b460-d3c07e4f3651"
migrations_dir = "src/db/migrations"

# ── KV namespace (chunked cache, mirrors Apps Script CacheService) ──
# Create with:  wrangler kv namespace create ccc-cache
# then paste the returned id here.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "e53d8e0df3d04533b140bb49b99d7df3"

# ── Scheduled tasks (cron, UTC) ────────────────────────────────────
# 0 17 * * *   = 00:00 Bangkok  — daily expired-discipline cleanup
# 15 17 1 */3 * = 00:15 Bangkok, 1st of every 3rd month — archive old reservations
[triggers]
crons = ["0 17 * * *", "15 17 1 */3 *"]

# ── Observability ──────────────────────────────────────────────────
[observability]
enabled = true
