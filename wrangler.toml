name = "ccc-backend"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0e00d9b1beeaf05140dd3777e0d2de90"

# ── Worker vars ────────────────────────────────────────────────────
[vars]
CACHE_VERSION = "v4"
PASSWORD_SALT = "cc-cafe-reservation-v1"
# Comma-separated list of frontend origins allowed to call the API.
# Use "*" during development. Example: https://ccc-backend.pongsinbas.workers.dev
ALLOWED_ORIGINS = "*"
# Comma-separated list of hostnames allowed to generate Turnstile tokens.
# IMPORTANT: these are the FRONTEND hosts that render the widget (siteverify
# returns the page hostname), NOT the backend worker hostname.
# Example: booking.example.com,www.example.com
TURNSTILE_ALLOWED_HOSTNAMES = "cida.dpdns.org,dashboard.cida.dpdns.org,cafe.dpdns.org,ccc-frontend.pages.dev"

# ── Notifications (Web Push + LINE) ────────────────────────────────
# Feature switches (set to "true" to enable).
NOTIFY_PUSH_ENABLED = "false"
NOTIFY_LINE_ENABLED = "false"
# Fallback LINE monthly push-message cap (an admin-overridable setting wins).
LINE_MONTHLY_CAP = "200"
# Only these events may spend quota. notify() drops everything else before a
# row is queued — widen the list to send more.
NOTIFY_EVENT_ALLOWLIST = "payment_due"
# Web Push is free and unlimited; LINE is capped. When "true", a booking that
# already has a browser subscription never costs a LINE message.
NOTIFY_LINE_FALLBACK_ONLY = "true"

# ── Slip auto-verification (Workers AI OCR) ────────────────────────
# OCR reads the amount / Ref1 / payee / time off the slip so a genuine
# Mini-QR can be matched against the booking without a bank Open API.
SLIP_OCR_ENABLED = "true"
SLIP_OCR_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# Daily inference budget — Workers AI gives 10,000 free Neurons/day.
SLIP_OCR_DAILY_MAX = "300"
# Writes the paid status by itself. Keep "false" until the scores look right.
SLIP_AUTO_APPROVE_ENABLED = "false"
# Slips older than this (by their own printed timestamp) never auto-approve.
SLIP_MAX_AGE_HOURS = "72"

# ── D1 database ────────────────────────────────────────────────────
# Create with:  wrangler d1 create ccc-reservations
# then paste the returned database_id here and in the migration script note.
[[d1_databases]]
binding = "DB"
database_name = "ccc-reservations"
database_id = "c24082d0-67dd-4c21-b460-d3c07e4f3651"
migrations_dir = "src/db/migrations"

# ── KV namespace (chunked cache, mirrors Apps Script CacheService) ──
# Create with:  wrangler kv namespace create ccc-cache
# then paste the returned id here.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "e53d8e0df3d04533b140bb49b99d7df3"

# ── Workers AI (slip OCR) ──────────────────────────────────────────
[ai]
binding = "AI"

# ── Scheduled tasks (cron, UTC) ────────────────────────────────────
# 0 17 * * *   = 00:00 Bangkok  — daily expired-discipline cleanup
# 15 17 1 */3 * = 00:15 Bangkok, 1st of every 3rd month — archive old reservations
[triggers]
crons = ["0 17 * * *", "15 17 1 */3 *"]

# ── Observability ──────────────────────────────────────────────────
[observability]
enabled = true

# ═══════════════════════════════════════════════════════════════════
# Development environment  —  npm run deploy:dev
#   Worker : https://ccc-backend-dev.pongsinbas.workers.dev
#   D1     : ccc-reservations-dev   (sanitised copy of production)
#   KV     : ccc-cache-dev
#
# NOTE: wrangler does NOT inherit top-level [vars], [[d1_databases]],
# [[kv_namespaces]] or [triggers] into an [env.*] block — everything
# below must be declared explicitly. main / compatibility_date /
# compatibility_flags / account_id ARE inherited.
# ═══════════════════════════════════════════════════════════════════
[env.development]
name = "ccc-backend-dev"

[env.development.vars]
# Distinct from prod so dev and prod KV keys can never collide.
CACHE_VERSION = "dev-v1"
# MUST match production — the seeded users table carries prod password
# hashes, and scripts/migrate-sheets.ts hardcodes this same salt.
PASSWORD_SALT = "cc-cafe-reservation-v1"
# Exact full-origin match only (see makeCorsHeaders in middleware/http.ts) —
# no wildcards, no subdomain matching. List every dev origin literally.
ALLOWED_ORIGINS = "https://dev.ccc-frontend.pages.dev,https://dev.ccc-dashboard-6jh.pages.dev,http://localhost:5173,http://localhost:5174"
# Unlike CORS, this one DOES match subdomains (endsWith '.' + allowed).
TURNSTILE_ALLOWED_HOSTNAMES = "dev.ccc-frontend.pages.dev,dev.ccc-dashboard-6jh.pages.dev,localhost"
# Kept off so dev can never push a notification or LINE message to a real visitor.
NOTIFY_PUSH_ENABLED = "false"
NOTIFY_LINE_ENABLED = "false"
LINE_MONTHLY_CAP = "200"
NOTIFY_EVENT_ALLOWLIST = "payment_due"
NOTIFY_LINE_FALLBACK_ONLY = "true"
# OCR runs on dev (it only reads), but nothing may settle a booking by itself.
SLIP_OCR_ENABLED = "true"
SLIP_OCR_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
SLIP_OCR_DAILY_MAX = "50"
SLIP_AUTO_APPROVE_ENABLED = "false"
SLIP_MAX_AGE_HOURS = "72"

[[env.development.d1_databases]]
binding = "DB"
database_name = "ccc-reservations-dev"
database_id = "eefa631b-e7e8-4a38-af31-efebb52fa3af"
migrations_dir = "src/db/migrations"

[[env.development.kv_namespaces]]
binding = "CACHE_KV"
id = "f667fc0048e14ef48a489ec298cfbbaa"

[env.development.ai]
binding = "AI"

# No cron in dev — the daily discipline cleanup and the quarterly archive
# job would silently mutate dev data in the background. Run them on demand:
#   npx wrangler dev --env development --test-scheduled
[env.development.triggers]
crons = []

[env.development.observability]
enabled = true
